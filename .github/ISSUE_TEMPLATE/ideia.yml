name: Ideia
description: Proposta de técnica, tool ou melhoria.
labels: [ideia]
body:
  - type: textarea
    id: problema
    attributes:
      label: Problema
      description: O que você tenta fazer e o servidor ainda não resolve.
    validations:
      required: true
  - type: textarea
    id: proposta
    attributes:
      label: Proposta
      description: Como você imagina a solução (tool nova, parâmetro, campo na resposta).
    validations:
      required: true
