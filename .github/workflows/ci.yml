name: CI

permissions:
  contents: read

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      # Os ids abaixo não têm correção dentro dos tetos do requirements.txt, e os
      # tetos de major são regra do projeto: starlette (corrige em >=1.0) e pytest
      # (>=9) exigem major acima do teto; cryptography (transitiva) só corrige em
      # versões que exigem cffi>=2, e timezonefinder==6.5.2 fixa cffi<2.
      # Reavaliar ao subir esses tetos/pins.
      - run: >
          pip-audit -r requirements.txt --strict
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-1845
          --ignore-vuln PYSEC-2026-2141
          --ignore-vuln PYSEC-2026-35
          --ignore-vuln PYSEC-2026-36
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554
          --ignore-vuln GHSA-537c-gmf6-5ccf
