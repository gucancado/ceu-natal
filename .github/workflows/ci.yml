name: CI

permissions:
  contents: read

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: python -m pytest -q

  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      # O lock (requirements.txt) só tem runtime; os ids abaixo são todos da
      # cryptography 46.0.0 (transitiva via mcp -> pyjwt[crypto]). As correções
      # (>=46.0.5) exigem cffi>=2, e timezonefinder==6.5.2 fixa cffi<2: o
      # resolvedor não acha saída dentro dos pins/tetos. Reavaliar ao subir o
      # timezonefinder. (PYSEC-2026-1845, do pytest, saiu em 2026-11-05: pytest
      # agora é só dev; os 5 ids do starlette saíram em 2026-11-03 com o piso 1.3.1.)
      - run: >
          pip-audit -r requirements.txt --strict
          --ignore-vuln PYSEC-2026-2141
          --ignore-vuln PYSEC-2026-35
          --ignore-vuln PYSEC-2026-36
          --ignore-vuln PYSEC-2026-3552
          --ignore-vuln PYSEC-2026-3553
          --ignore-vuln PYSEC-2026-3554
          --ignore-vuln GHSA-537c-gmf6-5ccf

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm i -g pnpm@11
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
