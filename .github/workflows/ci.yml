name: CI

on: [push, pull_request]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  auditoria:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install pip-audit
      # Os ids abaixo só têm correção em major acima do teto do requirements.txt
      # (starlette >=1.0, pytest >=9), e os tetos de major são regra do projeto
      # (ver requirements.txt). Reavaliar ao subir o teto.
      - run: >
          pip-audit -r requirements.txt --strict
          --ignore-vuln PYSEC-2026-161
          --ignore-vuln PYSEC-2026-248
          --ignore-vuln PYSEC-2026-249
          --ignore-vuln PYSEC-2026-2280
          --ignore-vuln PYSEC-2026-2281
          --ignore-vuln PYSEC-2026-1845
