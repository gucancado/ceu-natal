version: 2
updates:
  # O requirements.txt é um lock gerado a partir do requirements.in com
  #   uv pip compile requirements.in -o requirements.txt --python-version 3.11
  # Um PR do Dependabot que mexa no lock deve ser refeito regenerando-o assim.
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-patch:
        update-types: [minor, patch]
    ignore:
      # Subir cryptography/cffi isolados quebra o lock: timezonefinder==6.5.2
      # fixa cffi<2. Reavaliar junto com o timezonefinder.
      - dependency-name: cryptography
      - dependency-name: cffi

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    groups:
      web-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
